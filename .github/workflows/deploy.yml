name: Build and Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf patches
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd project && npm install --legacy-peer-deps && npm run build
      - run: ls -la project/dist/public/ 2>&1 || true
      - run: ls -la project/dist/ 2>&1 || true
      - run: rm -rf dist && mkdir -p dist && cp -r project/dist/public/* dist/ && cp project/dist/index.js dist/ 2>/dev/null; ls -la dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
